name: nightly

on:
  schedule: [{ cron: "17 2 * * *" }]
  workflow_dispatch:

jobs:
  full-suite:
    name: full suite, benchmarks, and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci-password, POSTGRES_DB: lab_assistant_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "packages/python[dev,parsers]" -e services/api
      - name: full suite including slow tests
        env:
          LAB_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-password@localhost:5432/lab_assistant_test
        run: pytest -q
      - name: synthetic benchmark run
        run: python tools/cli/run_benchmarks.py --benchmarks benchmarks/synthetic
      - name: backup and restore drill on synthetic data
        env:
          PGPASSWORD: ci-password
        run: |
          cd database && LAB_DATABASE_URL=postgresql+asyncpg://postgres:ci-password@localhost:5432/lab_assistant_test alembic upgrade head
          pg_dump -h localhost -U postgres lab_assistant_test > /tmp/backup.sql
          psql -h localhost -U postgres -c 'CREATE DATABASE restore_drill'
          psql -h localhost -U postgres restore_drill < /tmp/backup.sql
          # A backup nobody has restored is not a backup.
          psql -h localhost -U postgres restore_drill -c "select count(*) from works"

  live-connectors:
    name: opt-in live connector smoke tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "packages/python[dev]" -e services/api
      - name: low-volume live checks
        # Opt-in only, respectful volume, and never required for an ordinary run.
        env:
          LAB_LIVE_SOURCE_TESTS: "1"
          LAB_CONNECTOR_CONTACT: ${{ secrets.CONNECTOR_CONTACT }}
        run: pytest -q -m live_source
