# Scrape configuration for the optional monitoring overlay.
# Not enabled by default: see README.md and docs/operations/monitoring.md.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: lab-assistant

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API exposes process and request metrics. Readiness is a separate probe
  # because "the process is up" and "its dependencies are reachable" are different
  # facts, and conflating them is how a degraded object store looks healthy.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: api-readiness
    metrics_path: /probe
    params:
      target: ["http://api:8000/ready"]
    static_configs:
      - targets: ["blackbox:9115"]

  # Queue depth comes from task rows, never from worker heartbeats: progress is a
  # durable fact, and a missing heartbeat says nothing about whether work completed.
  - job_name: queue
    metrics_path: /metrics
    static_configs:
      - targets: ["queue-exporter:9187"]
