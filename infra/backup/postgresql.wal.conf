# Archiving settings point-in-time recovery requires. Include from postgresql.conf,
# or set them under `command:` in the compose overlay.
#
# Without WAL archiving there is no point-in-time recovery, and the stated RPO of
# 15 minutes is fiction: a nightly dump loses up to a day.

wal_level = replica
archive_mode = on
archive_timeout = 300s          # bound data loss to five minutes of idle time
max_wal_senders = 3
wal_keep_size = 1GB

# The archive command must be atomic and must fail loudly. A silently failing archive
# accumulates WAL until the disk fills, which takes PostgreSQL down with it — see
# docs/operations/runbooks/disk-pressure.md.
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'

# Restore side, written by restore.sh when a target time is given.
# restore_command = 'cp /wal-archive/%f %p'
