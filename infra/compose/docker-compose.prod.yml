# Production overlay for the deployment VM.
#
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml up -d
#
# Differences from development: no published database port, restart policies,
# resource limits, read-only root filesystems where possible, and addresses from
# .env.server — overridden per host by an optional, uncommitted .env.site.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# Every container, the database and one-off `compose run` containers included,
# runs in one systemd slice. scripts/deploy/update.sh gives the slice a CPU quota
# of 80% of the host's CPUs, so together they never take the whole VM; the
# per-container limits below cannot do that, since each can sit under its own
# limit while their sum is the whole machine. On a host whose slice has no quota
# yet (before the first update.sh run), the slice is created without one.
x-cpu-slice: &cpu-slice labassistant.slice

services:
  db:
    cgroup_parent: *cpu-slice
    ports: !reset []          # never publish the database on the VM
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000

  api:
    cgroup_parent: *cpu-slice
    ports: !override ["127.0.0.1:${LAB_API_HOST_PORT:-8100}:8000"]
    volumes:
      - clamav-socket:/run/clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
    depends_on:
      scanner: { condition: service_healthy }
    env_file: &server-env
      - .env
      - .env.server
      # This host's own addresses, read last so they win over the committed
      # .env.server. Optional: the Imperial VM has none (see .env.site.example).
      - { path: .env.site, required: false }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging: *logging

  worker-network:
    cgroup_parent: *cpu-slice
    env_file: *server-env
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # It fetches documents and scans each one before storing it.
    volumes:
      - clamav-socket:/run/clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
    depends_on:
      scanner: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  worker-compute:
    cgroup_parent: *cpu-slice
    env_file: *server-env
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # The queue coordinator needs PostgreSQL, S3, and model-provider access.
    # This is not a per-document network sandbox; see ADR-0021.
    volumes:
      - clamav-socket:/run/clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
    depends_on:
      scanner: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
    logging: *logging

  web:
    cgroup_parent: *cpu-slice
    ports: !override ["127.0.0.1:${LAB_WEB_HOST_PORT:-3300}:3002"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  scanner:
    cgroup_parent: *cpu-slice
    build:
      context: .
      dockerfile: infra/compose/scanner.Dockerfile
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
      - clamav-socket:/run/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }
    logging: *logging

volumes:
  clamav-signatures:
  clamav-socket:
