# Production overlay for the deployment VM.
#
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml up -d
#
# Differences from development: no published database port, restart policies,
# resource limits, read-only root filesystems where possible, and addresses from
# .env.server.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  db:
    ports: !reset []          # never publish the database on the VM
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000

  api:
    ports: !override ["127.0.0.1:${LAB_API_HOST_PORT:-8100}:8000"]
    volumes:
      - clamav-socket:/run/clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
    depends_on:
      scanner: { condition: service_healthy }
    env_file: [.env, .env.server]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging: *logging

  worker-network:
    env_file: [.env, .env.server]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  worker-compute:
    env_file: [.env, .env.server]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # The queue coordinator needs PostgreSQL, S3, and model-provider access.
    # This is not a per-document network sandbox; see ADR-0021.
    volumes:
      - clamav-socket:/run/clamav:ro
      - clamav-signatures:/var/lib/clamav:ro
    depends_on:
      scanner: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
    logging: *logging

  web:
    ports: !override ["127.0.0.1:${LAB_WEB_HOST_PORT:-3300}:3002"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  scanner:
    build:
      context: .
      dockerfile: infra/compose/scanner.Dockerfile
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
      - clamav-socket:/run/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }
    logging: *logging

volumes:
  clamav-signatures:
  clamav-socket:
