[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-assistant"
version = "0.1.0"
description = "Lab AI Assistant: versioned, policy-controlled evidence graph for research labs"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "tenacity>=8.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pyyaml>=6.0",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Everything needed to run the full offline test suite.
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  # Pinned, not a floor. `ruff format --check .` is a CI gate, and the formatter
  # changes between releases — so an unpinned range meant CI formatted with
  # whatever was current that morning and the gate went red on code nobody had
  # touched. Bump deliberately, and reformat in the same commit.
  "ruff==0.16.2",
  "mypy>=1.10",
  # Lets the SQL adapter run against SQLite offline; PostgreSQL integration tests
  # still need LAB_TEST_DATABASE_URL.
  "aiosqlite>=0.20",
  # The S3 adapter's contract tests run against botocore's stubber, offline. A
  # dev environment without it would skip exactly the tests ADR-0017 claimed to
  # have and did not.
  "boto3>=1.35",
]
# Optional adapters. The core suite never imports these.
parsers = ["pypdf>=4.2", "openpyxl>=3.1", "python-docx>=1.1"]
embeddings = ["sentence-transformers>=2.7"]
# The S3 adapter uses the maintained AWS SDK for its credential chain,
# conditional writes and error codes (ADR-0023 supersedes ADR-0017).
objectstore = ["boto3>=1.35"]
anthropic = ["anthropic>=0.40"]
export = ["pyarrow>=16.0"]

[project.scripts]
lab = "lab_assistant.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lab_assistant*"]

[tool.setuptools.package-data]
lab_assistant = ["py.typed"]
