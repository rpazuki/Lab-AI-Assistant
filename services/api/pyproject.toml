[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-assistant-api"
version = "0.1.0"
description = "Lab AI Assistant FastAPI control plane"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "lab-assistant",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lab_assistant_api*"]
