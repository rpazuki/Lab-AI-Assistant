# Workspace tooling and shared Python configuration.
#
# This file is NOT an installable distribution. The two installable Python
# distributions are:
#
#   packages/python   -> lab-assistant       (domain, application, adapters)
#   services/api      -> lab-assistant-api   (FastAPI control plane)
#
# Install both in editable mode:
#
#   python3.12 -m venv .venv
#   .venv/bin/pip install -e "packages/python[dev]" -e services/api

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = [
  "B008",   # FastAPI dependency defaults
  "SIM108", # ternaries are not always clearer
  # This project deliberately handles ambiguous Unicode: the span normalisation
  # contract names the exact characters it folds (micro sign, en dash, Greek mu),
  # and prose uses en dashes. Flagging them would mean escaping the very
  # characters the contract is about.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"lxml".msg = "Not an approved dependency; see docs/architecture/adr/0011-parsing-stack-and-licence.md"
"fitz".msg = "PyMuPDF is AGPL; see docs/architecture/adr/0011-parsing-stack-and-licence.md"

[tool.ruff.lint.isort]
known-first-party = ["lab_assistant", "lab_assistant_api"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["packages/python/lab_assistant", "services/api/src", "tools"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["packages/python/tests", "services/api/tests", "tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires a live PostgreSQL 16 + pgvector instance (LAB_TEST_DATABASE_URL)",
  "live_source: opt-in network test against a real scholarly source (LAB_LIVE_SOURCE_TESTS=1)",
  "slow: long-running test excluded from the pull-request pipeline",
]
filterwarnings = ["error::DeprecationWarning:lab_assistant.*"]

[tool.coverage.run]
branch = true
source = ["lab_assistant", "lab_assistant_api"]
