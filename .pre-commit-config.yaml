# Fast local gates. CI runs the same checks plus the full suite.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the pinned ruff in packages/python/pyproject.toml. At v0.8.4 the
    # hook reformatted files the CI gate had just accepted, so the two fought and
    # the loser was whoever committed last.
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      # A secret reaching a commit is the incident the predecessor had.
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-runtime-secret-files
        name: no runtime secret files
        entry: >
          bash -c 'if git diff --cached --name-only | grep -Ei "(adminpass|secret|\.pem$|\.key$)"; then
          echo "refusing: runtime secret file staged"; exit 1; fi'
        language: system
        pass_filenames: false
